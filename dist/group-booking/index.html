<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Ajukan group booking penerbangan bersama Jasa Tiket Murah."><link rel="icon" href="/assets/favicon.png"><link rel="stylesheet" href="/styles.css?v=096e6b9e0f8c"><title>Group Booking | Jasa Tiket Murah</title></head><body><div id="site-header"><header class="site-header"><a class="brand" href="/"><img src="/assets/logo.png" alt="Jasa Tiket Murah"></a><nav class="main-nav"><a href="/">Beranda</a><a href="/inspiration/">Inspirasi</a><a href="/about/">Tentang kami</a><a href="/contact/">Hubungi kami</a></nav></header></div><main class="page"><section class="wrap contact-layout"><div><h1>Group booking</h1><p class="page-lead">Butuh perjalanan untuk lebih dari 10 orang? Kirim detail rencana Anda dan tim kami akan membantu menyiapkan pilihan terbaik.</p><a class="email-link" href="mailto:cs@jasatiketmurah.com">cs@jasatiketmurah.com</a></div><form id="group-booking-form" class="contact-form"><div class="field-grid"><label>Nama lengkap<input name="name" required></label><label>Email<input name="email" type="email" required></label></div><div class="field-grid"><label>Dari<input name="origin" placeholder="Jakarta (CGK)" required></label><label>Ke<input name="destination" required></label></div><div class="field-grid"><label>Jenis perjalanan<select name="tripType"><option>Sekali jalan</option><option>Pulang-pergi</option><option>Multi-kota</option></select></label><label>Tanggal<input name="date" type="date" required></label></div><div class="field-grid"><label>Dewasa<input name="adults" type="number" min="1" required></label><label>Anak<input name="children" type="number" min="0" value="0"></label></div><label>Bayi<input name="infants" type="number" min="0" value="0"></label><label id="group-captcha-label">Verifikasi</label><input id="group-captcha" inputmode="numeric" required><button class="primary-button" type="submit">Kirim permintaan</button><p id="group-booking-feedback" class="form-feedback"></p></form></section></main><div id="site-footer"></div><script src="/i18n/translations.js?v=096e6b9e0f8c"></script><script src="/script.js?v=096e6b9e0f8c"></script></body></html>
