<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Ajukan group booking penerbangan bersama Jasa Tiket Murah.">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/styles.css?v=46e46fc341c3">
  <title>Group Booking | Jasa Tiket Murah</title>
</head>
<body>
  <div id="site-header"><header class="site-header"><a class="brand" href="/"><img src="/assets/logo.png" alt="Jasa Tiket Murah"></a><nav class="main-nav"><a href="/">Beranda</a><a href="/inspiration/">Inspirasi</a><a href="/about/">Tentang kami</a><a href="/contact/">Hubungi kami</a></nav></header></div>
  <main class="page">
    <section class="wrap contact-layout">
      <div>
        <h1>Group booking</h1>
        <p class="page-lead">Butuh perjalanan untuk lebih dari 10 orang? Kirim detail rencana Anda dan tim kami akan membantu menyiapkan pilihan terbaik.</p>
        <a class="email-link" href="mailto:cs@jasatiketmurah.com">cs@jasatiketmurah.com</a>
      </div>
      <form id="group-booking-form" class="contact-form">
        <div class="field-grid">
          <label>Nama lengkap<input name="name" required></label>
          <label>Email<input name="email" type="email" required></label>
        </div>
        <div class="field-grid">
          <label>Dari<input name="origin" placeholder="Jakarta (CGK)" required></label>
          <label>Ke<input name="destination" required></label>
        </div>
        <div class="field-grid">
          <label>Jenis perjalanan<select name="tripType"><option>Sekali jalan</option><option>Pulang-pergi</option><option>Multi-kota</option></select></label>
          <label>Tanggal<input name="date" type="date" required></label>
        </div>
        <label class="group-passenger-field"><span>Penumpang</span><button type="button" class="group-passenger-trigger" aria-expanded="false">1 dewasa</button><div class="group-passenger-popover" hidden><div class="traveller-row"><span><b>Dewasa</b><small>12 tahun ke atas</small></span><div class="counter"><button type="button" data-group-counter="adults" data-step="-1">−</button><output data-group-count="adults">1</output><button type="button" data-group-counter="adults" data-step="1">+</button></div></div><div class="traveller-row"><span><b>Anak</b><small>2–11 tahun</small></span><div class="counter"><button type="button" data-group-counter="children" data-step="-1">−</button><output data-group-count="children">0</output><button type="button" data-group-counter="children" data-step="1">+</button></div></div><div class="traveller-row"><span><b>Bayi</b><small>Di bawah 2 tahun</small></span><div class="counter"><button type="button" data-group-counter="infants" data-step="-1">−</button><output data-group-count="infants">0</output><button type="button" data-group-counter="infants" data-step="1">+</button></div></div><button type="button" class="group-passenger-done">Selesai</button></div><input type="hidden" name="adults" value="1"><input type="hidden" name="children" value="0"><input type="hidden" name="infants" value="0"></label>
        <div class="captcha-row"><label id="group-captcha-label">Verifikasi</label><input id="group-captcha" inputmode="numeric" required></div>
        <button class="primary-button" type="submit">Kirim permintaan</button>
        <p id="group-booking-feedback" class="form-feedback"></p>
      </form>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="/i18n/translations.js?v=46e46fc341c3"></script><script src="/script.js?v=46e46fc341c3"></script>
</body>
</html>
