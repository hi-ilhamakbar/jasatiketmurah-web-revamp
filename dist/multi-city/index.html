<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Rencanakan penerbangan multi-kota bersama Jasa Tiket Murah."><link rel="icon" href="/assets/favicon.png"><link rel="stylesheet" href="/styles.css?v=46e46fc341c3"><title>Penerbangan Multi-kota | Jasa Tiket Murah</title></head><body><div id="site-header"><header class="site-header"><a class="brand" href="/"><img src="/assets/logo.png" alt="Jasa Tiket Murah"></a><nav class="main-nav"><a href="/">Beranda</a><a href="/inspiration/">Inspirasi</a><a href="/about/">Tentang kami</a><a href="/contact/">Hubungi kami</a></nav></header></div><main class="page"><section class="wrap"><h1>Rencanakan penerbangan multi-kota.</h1><p class="page-lead">Tambahkan hingga empat rute perjalanan.</p><form class="contact-form" id="multi-city-form"><div id="route-list"><div class="field-grid route-row"><label>Rute 1: Dari<input required placeholder="Jakarta (CGK)"></label><label>Ke<input required placeholder="Pilih kota tujuan"></label><label>Tanggal<input type="date" required></label><button class="remove-route" type="button" aria-label="Hapus rute">🗑 Hapus</button></div></div><div class="multi-actions"><button class="primary-button" type="button" id="add-route">+ Tambah rute</button><button class="primary-button" type="submit">Cari penerbangan</button></div><p class="form-feedback" id="multi-city-feedback"></p></form></section></main><div id="site-footer"></div><script src="/i18n/translations.js?v=46e46fc341c3"></script><script src="/script.js?v=46e46fc341c3"></script><script>const list=document.querySelector('#route-list'),today=new Date().toISOString().slice(0,10),last=new Date(Date.now()+300*864e5).toISOString().slice(0,10);const setDates=row=>{const input=row.querySelector('input[type=date]');input.min=today;input.max=last};const update=()=>{[...list.children].forEach((row,index)=>{row.querySelector('label').firstChild.textContent=`Rute ${index+1}: Dari`;setDates(row)});document.querySelector('#add-route').disabled=list.children.length>=4};const bind=row=>row.querySelector('.remove-route').addEventListener('click',()=>{if(list.children.length>1){row.remove();update()}});[...list.children].forEach(bind);update();document.querySelector('#add-route').addEventListener('click',()=>{if(list.children.length>=4)return;const row=list.children[0].cloneNode(true);row.querySelectorAll('input').forEach(input=>input.value='');bind(row);list.append(row);update()});document.querySelector('#multi-city-form').addEventListener('submit',event=>{event.preventDefault();document.querySelector('#multi-city-feedback').textContent='Pencarian multi-kota siap.'})</script></body></html>
