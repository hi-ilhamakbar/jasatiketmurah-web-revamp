<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Rencanakan penerbangan multi-kota bersama Jasa Tiket Murah."><link rel="icon" href="/assets/favicon.png"><link rel="stylesheet" href="/styles.css"><title>Penerbangan Multi-kota | Jasa Tiket Murah</title></head><body><div id="site-header"></div><main class="page"><section class="wrap"><h1>Rencanakan penerbangan multi-kota.</h1><p class="page-lead">Tambahkan hingga empat rute perjalanan. Harga live tersedia setelah integrasi supplier penerbangan.</p><form class="contact-form" id="multi-city-form"><div id="route-list"></div><div class="multi-actions"><button class="primary-button" type="button" id="add-route">+ Tambah rute</button><button class="primary-button" type="submit">Cari penerbangan</button></div><p class="form-feedback" id="multi-city-feedback"></p></form></section></main><div id="site-footer"></div><script src="/script.js"></script><script>const list=document.querySelector('#route-list'),today=new Date().toISOString().slice(0,10),last=new Date(Date.now()+300*864e5).toISOString().slice(0,10);function addRoute(){if(list.children.length>=4)return;const number=list.children.length+1,row=document.createElement('div');row.className='field-grid route-row';row.innerHTML=`<label>Rute ${number}: Dari<input required placeholder="Jakarta (CGK)"></label><label>Ke<input required placeholder="Pilih kota tujuan"></label><label>Tanggal<input type="date" min="${today}" max="${last}" required></label><button class="remove-route" type="button" aria-label="Hapus rute">🗑 Hapus</button>`;row.querySelector('.remove-route').addEventListener('click',()=>{if(list.children.length>1){row.remove();[...list.children].forEach((item,index)=>item.querySelector('label').firstChild.textContent=`Rute ${index+1}: Dari`)}});list.append(row);document.querySelector('#add-route').disabled=list.children.length>=4}addRoute();document.querySelector('#add-route').addEventListener('click',addRoute);document.querySelector('#multi-city-form').addEventListener('submit',event=>{event.preventDefault();document.querySelector('#multi-city-feedback').textContent='Pencarian multi-kota siap. Harga live akan tersedia setelah integrasi API.'})</script></body></html>
