ox"><span>Harga per pemohon</span><b id="japan-price">Rp0</b><small id="japan-speed-note">Pilih kecepatan proses</small><hr><span>Total</span><b id="japan-total">Rp0</b></div></aside><form id="japan-visa-form" class="visa-form" enctype="multipart/form-data"><h2>Detail aplikasi</h2><div class="field-grid"><label><span>Nama lengkap</span><input name="fullName" required></label><label><span>Email</span><input name="email" type="email" required></label></div><div class="field-grid"><label><span>Nomor kontak</span><div class="phone-input"><select class="country-code-select" name="phoneCountry" data-default="+62" aria-label="Kode negara" required></select><input name="phone" type="tel" inputmode="numeric" required autocomplete="tel"></div></label><label><span>Kewarganegaraan</span><select class="country-select" name="nationality" data-default="ID" required></select></label></div><div id="japan-documents" class="visa-documents" hidden></div><label class="visa-consent"><input type="checkbox" required><span>Saya menyetujui pemrosesan data dan dokumen untuk pengajuan visa ini.</span></label><button class="primary-button" type="submit" disabled>Lanjut ke pembayaran</button><p id="japan-feedback" class="form-feedback" aria-live="polite"></p></form></section></main><div id="site-footer"></div><script src="/i18n/translations.js?v=1e323bf0eaee"></script><script src="/script.js?v=1e323bf0eaee"></script><script src="/japan-visa.js"></script></body></html>
