<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Rencanakan penerbangan multi-kota bersama Jasa Tiket Murah."><link rel="icon" href="/assets/favicon.png"><link rel="stylesheet" href="/styles.css"><title>Penerbangan Multi-kota | Jasa Tiket Murah</title></head><body><div id="site-header"></div><main class="page"><section class="wrap"><h1>Rencanakan penerbangan multi-kota.</h1><p class="page-lead">Tambahkan rute perjalanan Anda hingga tujuh segmen. Pencarian harga akan tersedia setelah integrasi supplier penerbangan.</p><form class="contact-form" id="multi-city-form"><div id="route-list"><div class="field-grid route-row"><label>Dari<input required placeholder="Jakarta (CGK)"></label><label>Ke<input required placeholder="Pilih kota tujuan"></label><label>Tanggal<input type="date" required></label></div></div><button class="primary-button" type="button" id="add-route">+ Tambah rute</button><button class="primary-button" type="submit">Cari penerbangan</button><p class="form-feedback" id="multi-city-feedback"></p></form></section></main><div id="site-footer"></div><script src="/script.js"></script><script>const list=document.querySelector('#route-list');document.querySelector('#add-route')?.addEventListener('click',()=>{if(list.children.length>=7)return;const row=list.children[0].cloneNode(true);row.querySelectorAll('input').forEach(input=>input.value='');list.append(row)});document.querySelector('#multi-city-form')?.addEventListener('submit',event=>{event.preventDefault();document.querySelector('#multi-city-feedback').textContent='Pencarian multi-kota siap. Harga live akan tersedia setelah integrasi API.'})</script></body></html>
